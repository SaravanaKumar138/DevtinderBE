name: Devtinder Backend CI/CD

on:
  push:
    branches:
      - main  # Adjust this if your default branch is 'master'

jobs:
  # JOB 1: Build and Test (Ensures code isn't broken)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1' # Use your Node version

      - name: Install Dependencies
        run: npm install

      # Optional: Add 'npm test' here if you have tests
      # - name: Run Tests
      #   run: npm test

  # JOB 2: Deploy to EC2 (Only runs if Build passes)
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploying to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
          export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            # 1. Go to the project directory
            cd /home/ubuntu/DevtinderBE
            
            # 2. Pull the latest code
            git pull origin main
            
            # 3. Install only production dependencies (saves space)
            npm install --production
            
            # 4. Restart the app with PM2
            # This will restart it if it exists, or start it if it doesn't.
            pm2 restart 0 || pm2 start src/app.js --name "DevtinderBE"
            
            # 5. Save PM2 list so it restarts on EC2 reboot
            pm2 save