name: Devtinder Backend CI/CD

on:
  push:
    branches:
      - main 

jobs:
  # JOB 1: Build and Test
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Install Dependencies
        run: npm install

  # JOB 2: Deploy to EC2
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploying to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 1. Load NVM and Node (This must be indented properly)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # 2. Go to the project directory
            cd /home/ubuntu/DevtinderBE || exit
            
            # 3. Pull the latest code
            git pull origin main
            
            # 4. Install production dependencies
            npm install --production
            
            # 5. Restart the app
            # Using the name "DevtinderBE" is safer than ID "0"
            pm2 restart DevtinderBE || pm2 start src/app.js --name "DevtinderBE"
            
            # 6. Save PM2 list for auto-reboot
            pm2 save